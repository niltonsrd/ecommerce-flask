{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin-premium.css') }}">
{% endblock %}
{% block content %}
<section class="admin-shell">
    <div class="admin-page-header">
        <div>
            <span class="section-kicker">Admin</span>
            <h1>Novo Frete</h1>
            <p>Cadastre uma nova região de entrega.</p>
        </div>
    </div>

    <div class="admin-form-card">
        <form method="POST">
            <div class="admin-form-group">
                <label>Nome da região</label>
                <input type="text" name="nome_regiao" placeholder="Ex: Região Sudeste" required>
            </div>

            <div class="admin-form-row">
                <div class="admin-form-group">
                    <label>CEP inicial</label>
                    <input type="text" name="cep_inicio" placeholder="Ex: 01000000" required>
                </div>
                <div class="admin-form-group">
                    <label>CEP final</label>
                    <input type="text" name="cep_fim" placeholder="Ex: 09999999" required>
                </div>
            </div>

            <div class="admin-form-row">
                <div class="admin-form-group">
                    <label>Valor do frete (R$)</label>
                    <input type="number" step="0.01" name="valor" placeholder="Ex: 19.90" required>
                </div>
                <div class="admin-form-group">
                    <label>Prazo em dias</label>
                    <input type="number" name="prazo_dias" placeholder="Ex: 7" required>
                </div>
            </div>

            <div class="admin-form-group">
                <label>Status</label>
                <select name="ativo">
                    <option value="true">Ativo</option>
                    <option value="false">Inativo</option>
                </select>
            </div>

            <div class="admin-form-actions">
                <a href="/admin/fretes" class="btn-admin-outline">Cancelar</a>
                <button type="submit" class="btn-admin">Salvar Frete</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
